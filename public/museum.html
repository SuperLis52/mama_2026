<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MAMA Museum</title><style>*{box-sizing:border-box}body{margin:0;background:#211b16;color:#fff5df;font:16px Georgia,serif}canvas{display:block;touch-action:none}header{position:fixed;top:0;left:0;right:0;padding:18px;background:linear-gradient(#211b16df,transparent);display:flex;justify-content:space-between;align-items:center;gap:10px}a,button{color:inherit;background:#30261de8;border:1px solid #bda16c;border-radius:30px;padding:12px 18px;font:inherit;text-decoration:none;cursor:pointer}footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:20px 12px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#211b16f5 40%)}h2{margin:8px;font-weight:normal}small{letter-spacing:3px;color:#e5c997}.controls{display:flex;justify-content:center;gap:12px}#hint{font:12px system-ui;color:#e4d7c1}#error{position:fixed;top:40%;padding:24px;display:none}</style><header><a href="/">← MAMA</a><small>PRIVATE GALLERY</small><button id="music">♫</button></header><div id="error">Не удалось загрузить 3D-музей. Проверь интернет и поддержку WebGL.</div><footer><small id="count"></small><h2 id="title"></h2><div class="controls"><button id="back">← Назад</button><button id="view">К картине</button><button id="next">Вперёд →</button></div><p id="hint">Проведи пальцем по экрану, чтобы осмотреться</p></footer><audio id="audio" loop ><source src="music/blue-cafe.m4a" type="audio/mp4"><source src="music/blue-cafe.mp3" type="audio/mpeg"></audio><script type="module">
try { const T = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const titles=['Солнечный день','Вместе на прогулке','Новогодняя сказка','У моря','Цветы для тебя','Вместе'];const ratios=[864/1536,1536/864,1024/1536,1056/1408,1056/1408,1056/1408];const scene=new T.Scene();scene.background=new T.Color(0x29231d);scene.fog=new T.Fog(0x29231d,22,48);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,80);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xfff3dc,0x77604b,2));const mat=(c,m=0)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:.48});const wall=mat(0xe5d6bd),gold=mat(0xb68a42,.65),dark=mat(0x59412c),floor=mat(0x9d7953);function box(w,h,d,x,y,z,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}box(8,.2,40,0,-.1,-15,floor);box(8,.2,40,0,4.8,-15,wall);for(let side of [-1,1]){box(.25,4.8,40,side*4,2.4,-15,wall);for(let y of [.16,1,4.4])box(.16,.12,40,side*3.82,y,-15,gold)}box(8,4.8,.25,0,2.4,-35,wall);box(8,4.8,.25,0,2.4,5,wall);for(let z=4;z>-35;z-=.6)box(8,.008,.018,0,.008,z,dark);const loader=new T.TextureLoader();const exhibits=[];for(let i=0;i<6;i++){let s=i%2?1:-1,z=-2-i*5,w=Math.min(2.8,2.35*ratios[i]),h=w/ratios[i];let g=new T.Group();g.position.set(s*3.77,2.55,z);g.rotation.y=-s*Math.PI/2;scene.add(g);function part(w,h,d,x,y,z,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o)}part(w+.26,h+.26,.12,0,0,0,gold);part(w+.09,h+.09,.13,0,0,.025,dark);let tex=loader.load('museum-'+(i+1)+'.jpg');tex.colorSpace=T.SRGBColorSpace;let p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}));p.position.z=.1;g.add(p);let c=document.createElement('canvas');c.width=1024;c.height=200;let ctx=c.getContext('2d');ctx.fillStyle='#eee0c4';ctx.fillRect(0,0,1024,200);ctx.fillStyle='#49351e';ctx.font='42px Georgia';ctx.textAlign='center';ctx.fillText(titles[i],512,95);ctx.font='26px Georgia';ctx.fillText('MAMA COLLECTION • 0'+(i+1),512,150);let t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;let plaque=new T.Mesh(new T.PlaneGeometry(1.8,.35),new T.MeshBasicMaterial({map:t}));plaque.position.set(0,-h/2-.36,.1);g.add(plaque);let light=new T.PointLight(0xffdfaa,15,8);light.position.set(s*2.5,4.2,z);scene.add(light);exhibits.push({s,z});}let index=-1,face=false,yaw=0,targetYaw=0;camera.position.set(0,1.65,2);const dest=camera.position.clone();function update(){let e=exhibits[index];dest.set(face&&e?e.s*.9:0,1.7,e?e.z:2);targetYaw=face&&e?-e.s*Math.PI/2:0;document.querySelector('#count').textContent=index<0?'WELCOME':`EXHIBIT ${index+1} / 6`;document.querySelector('#title').textContent=index<0?'Музей наших воспоминаний':titles[index];document.querySelector('#back').disabled=index<0;document.querySelector('#next').disabled=index===5;}function step(d){index=Math.max(-1,Math.min(5,index+d));face=index>=0;update()}document.querySelector('#next').onclick=()=>step(1);document.querySelector('#back').onclick=()=>step(-1);document.querySelector('#view').onclick=()=>{if(index<0)step(1);else{face=!face;update()}};let px=null;renderer.domElement.onpointerdown=e=>{px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(px!==null){targetYaw-=(e.clientX-px)*.006;px=e.clientX}};renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>px=null;addEventListener('keydown',e=>{if(e.key==='ArrowUp')step(1);if(e.key==='ArrowDown')step(-1);if(e.key==='ArrowLeft')targetYaw+=.3;if(e.key==='ArrowRight')targetYaw-=.3});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#music').onclick=async()=>{let a=document.querySelector('#audio');if(a.paused){try{await a.play()}catch{alert('Добавь файл public/music/blue-cafe.mp3')}}else a.pause()};update();renderer.setAnimationLoop(()=>{camera.position.lerp(dest,.035);yaw+=(targetYaw-yaw)*.055;camera.rotation.y=yaw;renderer.render(scene,camera)});
} catch(e) { document.querySelector('#error').style.display='block'; document.querySelector('#error').textContent='3D недоступно. Обычная галерея доступна на главной странице.'; console.error(e); }
</script></html>
